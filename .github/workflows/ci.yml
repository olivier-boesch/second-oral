name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Tests unitaires (pas de services requis) ────────────────────────────────
  unit-tests:
    name: Tests unitaires
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Installer les dépendances de test
        run: pip install -r requirements-test.txt

      - name: Installer les dépendances Flask (pour les tests d'intégration)
        run: |
          pip install Flask Flask-WTF Flask-Limiter Flask-Compress flask-sse \
                      Flask-Talisman redis mysql-connector-python \
                      pyotp segno pillow pytz

      - name: Lancer tous les tests
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=webserver/csv_validator \
            --cov=webserver/app \
            --cov=setup_new_site \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false
