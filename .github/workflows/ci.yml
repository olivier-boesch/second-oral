name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Audit des vulnérabilités dans les dépendances ───────────────────────────
  security-audit:
    name: Audit sécurité (pip-audit)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2024-48

  # ── Tests (unitaires + intégration Flask, DB mockée) ───────────────────────
  tests:
    name: Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Installer les dépendances de test
        run: pip install -r requirements-test.txt

      - name: Installer les dépendances Flask
        run: |
          pip install Flask==3.1.3 Flask-WTF==1.3.0 Flask-Limiter==4.1.1 \
                      Flask-Compress==1.24 Flask-SSE==1.0.0 \
                      Flask-Talisman==1.1.0 redis==8.0.0 \
                      mysql-connector-python==9.7.0 \
                      pyotp==2.9.0 segno==1.6.6 pillow==12.1.1 pytz==2026.2 \
                      "odfpy>=1.4.0"

      - name: Lancer tous les tests
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=webserver/csv_validator \
            --cov=webserver/ods_handler \
            --cov=webserver/app \
            --cov=setup_new_site \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false
