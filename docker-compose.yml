services:

  # ── Application Flask / Gunicorn ──────────────────────────────────────────
  app:
    build:
      context: .
      args:
        # Transmis depuis .env (généré par setup_new_site.py) pour que
        # appuser dans le conteneur ait le même UID/GID que secondoral sur l'hôte.
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: secondoral-app
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Surchargent les valeurs localhost de app_secrets.py pour Docker
      DB_HOST: mariadb
      REDIS_URL: redis://redis:6379
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      # ── Code source monté depuis l'hôte (pas dans l'image) ──────────────
      - .:/app
      # ── Secrets : lecture seule, appartient à root:1000 sur l'hôte ────────
      # setup_new_site.py applique automatiquement :
      #   sudo chown root:1000 webserver/app_secrets.py
      #   sudo chmod 640 webserver/app_secrets.py
      # (GID 1000 = appuser dans le conteneur, défini dans le Dockerfile)
      - ./webserver/app_secrets.py:/app/webserver/app_secrets.py:ro
      # ── PDFs générés : volume nommé persistant ───────────────────────────
      # Remplace le sous-dossier du bind-mount → survit à docker compose down.
      # Hors de webserver/static/ (donc hors de tout ce que nginx sert en
      # statique) — accès exclusivement via /download après authentification
      # (cf. docs/securite.md). N'est PAS monté dans le service nginx.
      - generated_docs:/app/webserver/generated
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal
    # Pas de port exposé directement : le nginx Docker s'en charge

  # ── Nginx interne (reverse-proxy vers gunicorn) ───────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      # Accessible uniquement depuis localhost : le nginx hôte se connecte ici
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/second_oral.conf:/etc/nginx/conf.d/default.conf:ro
      # Assets statiques servis directement (hôte, lecture seule)
      - ./webserver/static:/app/static:ro
      # Les PDFs générés (volume generated_docs) ne sont volontairement PAS
      # montés ici : nginx ne doit jamais pouvoir les servir directement
      # (cf. docs/securite.md) — seul /download (Flask, authentifié) y accède.
    networks:
      - internal

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── MariaDB ───────────────────────────────────────────────────────────────
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME:-SecondOral}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_CHARACTER_SET_SERVER: utf8mb4
      MARIADB_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      # --connect seul (sans --innodb_initialized) pour fonctionner dès le démarrage
      test: ["CMD", "healthcheck.sh", "--connect"]
      start_period: 2m   # laisse le temps à l'init du volume au premier lancement
      interval: 5s
      timeout: 5s
      retries: 20

# ── Volumes persistants ───────────────────────────────────────────────────────
volumes:
  mariadb_data:
  redis_data:
  generated_docs:   # PDFs générés — accès exclusif au service app (jamais nginx)

# ── Réseau isolé ──────────────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge
